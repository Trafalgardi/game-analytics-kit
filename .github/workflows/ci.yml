name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Engine selftest (synthetic data, no network)
        run: python kit/selftest.py
      - name: Installer
        run: python tests/test_install.py
      - name: Report builder and the examples
        run: python docs/examples/sample-report/make_sample.py
      - name: Install plan into a scratch project
        run: |
          mkdir -p "$RUNNER_TEMP/game/.git"
          python install.py "$RUNNER_TEMP/game" --dry-run
