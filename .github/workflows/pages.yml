name: site

# The site: site/ (landing, EN and RU), docs/images/ and the example reports built from
# docs/examples/sample-report (made-up data: en/ under /examples/, ru/ under /ru/examples/).
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", "docs/examples/**", "kit/gak/report/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pages needs a public repository on the free plan: skip quietly while it is private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the example reports
        run: python docs/examples/sample-report/make_sample.py
      - name: Assemble the site
        run: |
          mkdir -p _site/images _site/examples
          cp -r site/. _site/
          cp docs/images/*.png _site/images/
          mkdir -p _site/ru/examples
          cp -r docs/examples/sample-report/en/analytics/reports/. _site/examples/
          cp -r docs/examples/sample-report/ru/analytics/reports/. _site/ru/examples/
          find _site -type d -name work -prune -exec rm -rf {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
