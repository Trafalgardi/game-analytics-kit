<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="{{generator}}">
<title>{{title}}</title>
<!-- Generated by `report build` / `report index`. Do not edit by hand. -->
{{fonts}}
<style>
{{css}}
</style>
<style>
/* index-only components */
.rlist { display: flex; flex-direction: column; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.rentry { background: var(--surface); padding: 20px 20px 18px; }
.rhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.rentry h2 { margin: 0; font-size: clamp(20px, 2.6vw, 24px); }
.rentry h2 a { color: var(--ink); text-decoration: none; }
.rentry h2 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.rslug { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; color: var(--ink-3); }
.rsub { color: var(--ink-2); margin: 6px 0 0; }
.rsub.none { color: var(--ink-3); font-style: italic; }
.rfacts { display: flex; flex-wrap: wrap; gap: 6px 26px; margin: 12px 0 0; }
.rfacts div { min-width: 0; }
.rfacts dt { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-3); }
.rfacts dd { margin: 0; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px;
  font-variant-numeric: tabular-nums; }
.rvers { list-style: none; padding: 0; margin: 14px 0 0; display: flex; flex-wrap: wrap; gap: 6px; max-width: none; }
.rvers li { max-width: none; display: inline-flex; align-items: baseline; gap: 8px; border: 1px solid var(--rule-strong);
  padding: 3px 9px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--ink-2); }
.rvers li.latest { border-color: var(--flow); }
.rvers li.draft { border-style: dashed; color: var(--ink-3); }
.rvers .vn { font-weight: 600; color: var(--ink); }
.rvers li.draft .vn { color: var(--ink-3); }
.rempty { background: var(--surface); padding: 24px 20px; color: var(--ink-2); }
.rfoot { margin-top: 28px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="wrap">
<header class="masthead">
  <p class="eyebrow">{{eyebrow}}</p>
  <h1>{{heading}}</h1>
  <p class="standfirst">{{standfirst}}</p>
</header>
<div class="rlist">
{{entries}}
</div>
<p class="rfoot">{{footer}}</p>
</div>
</body>
</html>
